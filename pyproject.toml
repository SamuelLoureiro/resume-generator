[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gerador-curriculos"
version = "0.1.0"
description = "RAG-based resume generator tailored for internship applications using LlamaIndex and Google Gemini"
authors = [{ name = "Samuel" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "llama-index-core",
    "llama-index-llms-gemini",
    "llama-index-embeddings-gemini",
    "llama-index-vector-stores-chroma",
    "llama-index-retrievers-bm25",
    "chromadb",
    "gradio",
    "jinja2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv",
    "pyyaml",
    "ragas",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
